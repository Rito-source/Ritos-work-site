<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RIto 的网页与虚拟装扮作品集。">
  <title>RIto‘s Work</title>
  <link rel="stylesheet" href="styles.css?v=outfit-select">
  <link rel="stylesheet" href="outfits.css?v=ride-pagination">
  <script defer src="outfits-data.js?v=quick-preview"></script>
  <script defer src="app.js?v=outfit-heading"></script>
</head>
<body>
<div id="mimoon-collection-preview">

  <a class="skip-link" href="#collection">跳到作品列表</a>
  <header class="site-header">
    <h1 class="site-title"><a class="brand" href="#" aria-label="RIto‘s Work 首页">RIto‘s Work</a></h1>
    <div class="header-sparks" aria-hidden="true"><i></i><i></i><i></i></div>
  </header>

  <main>
    <section class="collection" id="collection" aria-label="作品集">
      <div class="collection-toolbar">
        <div class="type-tabs" role="tablist" aria-label="作品大类">
        <button class="type-tab active" id="tab-event" role="tab" aria-selected="true" aria-controls="works-panel" data-type="event">网页</button>
        <button class="type-tab" id="tab-outfit" role="tab" aria-selected="false" aria-controls="works-panel" tabindex="-1" data-type="outfit">虚拟装扮</button>
        </div>
        <div class="gallery-tools" id="gallery-tools" role="group" aria-label="网页作品浏览工具">
          <label class="select-wrap gallery-series">
            <span class="sr-only">网页分类</span>
            <select id="series">
              <option value="all">全部分类</option>
              <option>史莱姆系列</option>
              <option>真爱系列</option>
              <option>家族互动</option>
              <option>榜单挑战</option>
              <option>VIP 专属</option>
              <option>主题活动</option>
            </select>
            <span aria-hidden="true">⌄</span>
          </label>
          <button class="gallery-tool" id="search-toggle" type="button" aria-label="搜索" aria-expanded="false" aria-controls="gallery-search" aria-keyshortcuts="/" title="搜索">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.75"/><path d="m15 15 4.5 4.5"/></svg>
          </button>
          <button class="gallery-tool" id="filter-toggle" type="button" aria-label="排序" aria-expanded="false" aria-controls="gallery-filters" title="排序">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h5m4 0h7M4 16h9m4 0h3"/><circle cx="11" cy="8" r="2"/><circle cx="15" cy="16" r="2"/></svg>
          </button>
          <div class="filter-bar gallery-search gallery-popover" id="gallery-search" hidden>
            <div class="search-wrap"><input id="search" type="search" placeholder="搜索活动名称、主题或内容…" aria-label="搜索作品"><kbd aria-hidden="true">/</kbd></div>
          </div>
          <div class="filter-bar gallery-filters gallery-popover" id="gallery-filters" hidden>
            <label class="select-wrap sort-select"><span class="sr-only">排序方式</span><select id="sort" aria-label="排序方式"><option value="newest" selected>由近及远</option><option value="oldest">由远及近</option></select><span aria-hidden="true">⌄</span></label>
          </div>
        </div>
        <label class="select-wrap gallery-series" id="outfit-series-control" hidden>
          <span class="sr-only">虚拟装扮分类</span>
          <select id="outfit-category" aria-controls="outfit-gallery">
            <option value="frame">头像框</option>
            <option value="seat">座位框</option>
            <option value="ride">座驾</option>
          </select>
          <span aria-hidden="true">⌄</span>
        </label>
      </div>
      <div id="works-panel" role="tabpanel" aria-labelledby="tab-event">
        <div id="outfit-content" hidden>
          <div id="outfit-gallery"></div>
        </div>
        <div class="results-line" id="results-line"><span id="result-count" role="status" aria-live="polite">正在载入作品…</span></div>
        <div class="works-grid" id="works-grid"></div>
        <div class="empty-state" id="empty-state" hidden></div>
        <nav class="pagination" id="pagination" aria-label="网页作品分页" hidden></nav>
        <noscript><p class="no-script">请开启 JavaScript 以浏览作品、搜索和筛选。</p></noscript>
      </div>
    </section>
  </main>

  <dialog id="detail-dialog" aria-labelledby="detail-title">
    <div class="detail-shell">
      <img class="detail-image" id="detail-image" alt="">
      <button class="close-dialog" id="close-dialog" type="button" aria-label="关闭作品详情">✕</button>
      <div class="detail-content">
        <div class="detail-heading">
          <h2 id="detail-title"></h2>
          <span class="series-tag" id="detail-series"></span>
        </div>
        <h3>活动简介</h3>
        <p class="detail-description" id="detail-description"></p>
        <div class="detail-impact">
          <div class="detail-analysis">
            <p id="detail-goal"></p>
            <p id="detail-effect"></p>
          </div>
        </div>
        <div class="detail-actions">
          <a class="primary-button" id="detail-link" target="_blank" rel="noopener noreferrer">打开活动网页 <span aria-hidden="true">↗</span></a>
          <button class="copy-button" id="copy-link" type="button">复制链接 <span aria-hidden="true">⧉</span></button>
        </div>
      </div>
    </div>
  </dialog>
  <dialog id="outfit-dialog" aria-labelledby="outfit-preview-title">
    <div class="outfit-preview-body">
      <button class="close-dialog" type="button" id="close-outfit-preview" aria-label="关闭动效预览">✕</button>
      <div class="outfit-preview-stage" id="outfit-preview-stage"></div>
      <div class="outfit-preview-info">
        <h2 class="sr-only" id="outfit-preview-title"></h2>
        <figure class="outfit-preview-thumbnail">
          <img id="outfit-preview-png" alt="" fetchpriority="low">
          <figcaption>略缩图</figcaption>
        </figure>
        <p class="frame-status" id="outfit-preview-status" role="status" hidden></p>
      </div>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

</div>

</body>
</html>
